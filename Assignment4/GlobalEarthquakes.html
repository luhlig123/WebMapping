<!DOCTYPE html>
<html>

  <head>
    <meta charset='utf-8' />
    <title>University of Oregon Mapping</title>
    <meta name='viewport' content='initial-scale=1,maximum-scale=1,user-scalable=no' />
    
      <script src="https://api.mapbox.com/mapbox-gl-js/v3.20.0/mapbox-gl.js"></script>
      <link href="https://api.mapbox.com/mapbox-gl-js/v3.20.0/mapbox-gl.css" rel="stylesheet">

    <style>
          /* Map and title banner styles */
          body { margin:0; padding:0}
          #map {position: absolute; top: 0; bottom: 0; width: 100%;}

          #title {
            z-index: 9999;
            background-color: lightblue;
            opacity: 70%;
            text-align: center;
            }


    </style>
  </head>

  <body>

    <!--  Main earthquake map  -->
      <div id="map"></div>

    <!--  Title banner -->
    <div id="title">
      <h1> Global Earthquakes </h1>
    </div>

    <script>
          
        mapboxgl.accessToken = "pk.eyJ1IjoibHVobGlnIiwiYSI6ImNtbmh5azVxZTA3cHQycHBrM2ppaWRidHIifQ.93RfYwf836-wyjee_c4yKQ";
   
        // Earthquake map initialization
        var map = new mapboxgl.Map({
          container: 'map',
          style: 'mapbox://styles/luhlig/cmogfrb5900jm01sebgf82vsz',
          center: [-16.108147789762608,  28.45027201038817],
          zoom: 1.5
        })

        //Map navigation controls
        map.addControl(new mapboxgl.NavigationControl({
          showCompass: false
        }), 'top-left');
        
    </script>

  </body>

</html>
