<!DOCTYPE html>
<html>

  <head>
    <meta charset='utf-8' />
    <title>University of Oregon Mapping</title>
    <meta name='viewport' content='initial-scale=1,maximum-scale=1,user-scalable=no' />
    
      <script src="https://api.mapbox.com/mapbox-gl-js/v3.20.0/mapbox-gl.js"></script>
      <link href="https://api.mapbox.com/mapbox-gl-js/v3.20.0/mapbox-gl.css" rel="stylesheet">

    <style>

          body { margin:0; padding:0}

          /*Main map styles*/
          #map {position: absolute; top: 0; bottom: 0; width: 100%;}

          /*Title banner styles*/
          #title {
            z-index: 9999;
            background-color: lightblue;
            opacity: 70%;
            text-align: center;
            }

    </style>
  </head>

  <body>
    <!--  Insert the map div here in the <body> of the page  (Part I)  -->
      <div id="map"></div>

    <!--  Title Banner -->
    <div id="title">
      <h1> Country Temp Change </h1>
    </div>

    <script>
          
        mapboxgl.accessToken = "pk.eyJ1IjoibHVobGlnIiwiYSI6ImNtbmh5azVxZTA3cHQycHBrM2ppaWRidHIifQ.93RfYwf836-wyjee_c4yKQ";

        //Map initialization
        var map = new mapboxgl.Map({
          container: 'map',
          style: 'mapbox://styles/luhlig/cmog78se200jh01se7ftua19e',
          center: [-97.95457787449006, 39.66672635368382],  
          zoom: 4
        })

        //Map navigation controls
        map.addControl(new mapboxgl.NavigationControl({
          showCompass: false
        }), 'top-left');
        
    </script>

  </body>

</html>
