<!DOCTYPE html>
<html>
<head>
    <meta charset='utf-8' />
    <title>Yellowstone Roadtrip</title>
    <meta name='viewport' content='initial-scale=1,maximum-scale=1,user-scalable=no' />
    <link href="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.7/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-BVYiiSIFeK1dGmJRAkycuHAHRg32OmUcww7on3RYdg4Va+PmSTsz/K68vbdEjh4u" crossorigin="anonymous">
    <script src='https://api.tiles.mapbox.com/mapbox-gl-js/v3.2.0/mapbox-gl.js'></script>
    <link href='https://api.tiles.mapbox.com/mapbox-gl-js/v3.2.0/mapbox-gl.css' rel='stylesheet' />
    <style>

        body { margin:0; padding:0; }
        #map { position:absolute; top:0; bottom:0; width:100%; }
    </style>
</head>
<body>

    <div id='map'></div>
    
    <script>
        //Mapbox token and stylesheet for Portland map
        mapboxgl.accessToken = 'pk.eyJ1IjoibHVobGlnIiwiYSI6ImNtbmh5azVxZTA3cHQycHBrM2ppaWRidHIifQ.93RfYwf836-wyjee_c4yKQ'; 
        var map = new mapboxgl.Map({
            container: 'map', // container id
            center: [-120.0249370143903, 45.52487467116839],  
            zoom: 5.3,
            minZoom: 5,
            style: 'mapbox://styles/luhlig/cmpd53j8c002r01pt2e5hcv8q' // stylesheet location
        });

        //Add zoom and rotation control
        map.addControl(new mapboxgl.NavigationControl(), 'top-left');


        //popups
        var Popup1 = new mapboxgl.Popup()
            .setHTML("Launching point in Hillsboro, Oregon");


        //markers
        var HillsboroMarker = new mapboxgl.Marker({color: "darkred"})
            .setLngLat([-123.0249370143903, 45.52487467116839])
            .setPopup(Popup1)
            .addTo(map);

        var YellowstoneMarker = new mapboxgl.Marker({color: "darkred"})
            .setLngLat([-111.11299743789438, 44.66404634409209])
            .addTo(map);

        //ROUTE B
        //-----------------------------------------------------------------------
        var MultnomahMarker = new mapboxgl.Marker({color: "darkblue"})
            .setLngLat([-122.07812398340792, 45.579724926842175])
            .setPopup(Popup1)
            .addTo(map);

        var PendeltonMarker = new mapboxgl.Marker({color: "darkblue"})
            .setLngLat([-118.67467847972134, 45.667469906630835])
            .setPopup(Popup1)
            .addTo(map);
        
        var HermistonMarker = new mapboxgl.Marker({color: "darkblue"})
            .setLngLat([-119.27514144749358, 45.83917553162739])
            .setPopup(Popup1)
            .addTo(map);

        var BonvilleMarker = new mapboxgl.Marker({color: "darkblue"})
            .setLngLat([-116.05176106118466, 43.496175370279396])
            .setPopup(Popup1)
            .addTo(map);
        
        var ShoshoneMarker = new mapboxgl.Marker({color: "darkblue"})
            .setLngLat([-114.26764025870881, 42.62434464194753])
            .setPopup(Popup1)
            .addTo(map);

        var RegisterMarker = new mapboxgl.Marker({color: "darkblue"})
            .setLngLat([-113.0386057136546, 42.65274997340813])
            .setPopup(Popup1)
            .addTo(map);
        
        var CalderaMarker = new mapboxgl.Marker({color: "darkblue"})
            .setLngLat([-111.44556662643467, 44.18472043711756])
            .setPopup(Popup1)
            .addTo(map);
        
        
        //-----------------------------------------------------------------------
        
    </script>

</body>
</html>
